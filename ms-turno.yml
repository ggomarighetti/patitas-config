server:
  port: 8084

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
            loggerLevel: basic
      compression:
        request:
          enabled: true
        response:
          enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/turno_db}
    username: ${DB_USERNAME:patitas}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

info:
  app:
    name: ms-turno
    description: Microservicio de gestión de turnos - Patitas Felices
    version: 1.0.0

logging:
  level:
    com.patitas.turno.adapter.out.feign: DEBUG
