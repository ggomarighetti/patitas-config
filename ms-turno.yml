server:
  port: 8084

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
            loggerLevel: basic
      compression:
        request:
          enabled: true
        response:
          enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/turno_db}
    username: ${DB_USERNAME:patitas}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

info:
  app:
    name: ms-turno
    description: Microservicio de gestión de turnos - Patitas Felices
    version: 1.0.0

logging:
  level:
    com.patitas.turno.adapter.out.feign: DEBUG

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      mascotaService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 100
      veterinarioService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 100
  retry:
    retryAspectOrder: 2
    instances:
      mascotaService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptionPredicate: com.patitas.turno.adapter.out.feign.RemoteCallRetryPredicate
        eventConsumerBufferSize: 100
      veterinarioService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptionPredicate: com.patitas.turno.adapter.out.feign.RemoteCallRetryPredicate
        eventConsumerBufferSize: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,retryevents
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    circuitbreakers:
      enabled: true
