server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              include-expression: "serviceId.toLowerCase().startsWith('ms-')"
          default-filters:
            - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
          routes:
            - id: ms-dueno
              uri: lb://ms-dueno
              predicates:
                - Path=/api/duenos/**
            - id: ms-mascota
              uri: lb://ms-mascota
              predicates:
                - Path=/api/mascotas/**
            - id: ms-veterinario
              uri: lb://ms-veterinario
              predicates:
                - Path=/api/veterinarios/**
            - id: ms-turno
              uri: lb://ms-turno
              predicates:
                - Path=/api/turnos/**
            - id: ms-dueno-v1
              uri: lb://ms-dueno
              predicates:
                - Path=/v1/duenos/**
              filters:
                - name: RewritePath
                  args:
                    regexp: '/v1/duenos/?(?<segment>.*)'
                    replacement: '/api/duenos/$1'
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: '*'
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: '*'
                allowCredentials: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only

info:
  app:
    name: api-gateway
    description: Punto de entrada de Patitas Felices
    version: 1.0.0
