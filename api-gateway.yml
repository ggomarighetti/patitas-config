server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              include-expression: "serviceId matches '(?i)ms-.*' and !(serviceId matches '(?i)ms-turno')"
          default-filters:
            - RewriteLocationResponseHeader=NEVER_STRIP, Location, ,
          routes:
            - id: ms-dueno
              uri: lb://ms-dueno
              predicates:
                - Path=/api/duenos/**
            - id: ms-mascota
              uri: lb://ms-mascota
              predicates:
                - Path=/api/mascotas/**
            - id: ms-veterinario
              uri: lb://ms-veterinario
              predicates:
                - Path=/api/veterinarios/**
            - id: ms-turno
              uri: lb://ms-turno
              predicates:
                - Path=/api/turnos/**,/ms-turno/**
              filters:
                - name: RewritePath
                  args:
                    regexp: '/ms-turno/(?<segment>.*)'
                    replacement: '/$1'
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@clientIpKeyResolver}'
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: ms-dueno-v1
              uri: lb://ms-dueno
              predicates:
                - Path=/v1/duenos/**
              filters:
                - name: RewritePath
                  args:
                    regexp: '/v1/duenos(?<segment>/?.*)'
                    replacement: '/api/duenos$1'
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: '*'
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: '*'
                allowCredentials: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only

info:
  app:
    name: api-gateway
    description: Punto de entrada de Patitas Felices
    version: 1.0.0
