server:
  port: 8085

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/patitas_auth}
    username: ${DB_USERNAME:patitas}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

info:
  app:
    name: ms-auth
    description: Autenticación de usuarios - Patitas Felices
    version: 1.0.0
